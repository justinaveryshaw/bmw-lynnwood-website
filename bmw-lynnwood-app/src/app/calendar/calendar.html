<!-- Outer container -->
<div class="calendar__root">

    <!-- month year title -->
    <div class="calendar__nav">
        <span class="calendar__nav-month">{{ selectedDay | date: 'LLLL' }}</span>
        <span class="calendar__nav-year">{{ selectedDay | date: 'yyyy' }}</span>
    </div>

    <!-- days of week names(row) -->
    <div class="calendar__week-day-names">
        <!-- individual name -->
        <div class="calendar__week-day-name">
            <span class="calendar__week-day-name-text">Monday</span>
        </div>
        <div class="calendar__week-day-name">
            <span class="calendar__week-day-name-text">Tuesday</span>
        </div>
        <div class="calendar__week-day-name">
            <span class="calendar__week-day-name-text">Wednesday</span>
        </div>
        <div class="calendar__week-day-name">
            <span class="calendar__week-day-name-text">Thursday</span>
        </div>
        <div class="calendar__week-day-name">
            <span class="calendar__week-day-name-text">Friday</span>
        </div>
        <div class="calendar__week-day-name">
            <span class="calendar__week-day-name-text">Saturday</span>
        </div>
        <div class="calendar__week-day-name">
            <span class="calendar__week-day-name-text">Sunday</span>
        </div>

    </div>

    <!-- weeks in month(row) -->
    <div class="calendar__week">
        <!-- individual day in week -->
        <div class="calendar__week-day calendar__week-day--empty">
            <!-- day number -->
            <span class="calendar__week-day-number">&nbsp;</span>
        </div>
        <div class="calendar__week-day calendar__week-day--empty">

            <span class="calendar__week-day-number">&nbsp;</span>

        </div>
        <div class="calendar__week-day">

            <span class="calendar__week-day-number">1</span>

        </div>
        <div class="calendar__week-day">

            <span class="calendar__week-day-number">2</span>

        </div>
        <div class="calendar__week-day">

            <span class="calendar__week-day-number">3</span>

        </div>
        <div class="calendar__week-day">

            <span class="calendar__week-day-number">4</span>

        </div>
        <div class="calendar__week-day">

            <span class="calendar__week-day-number">5</span>

        </div>

    </div>
